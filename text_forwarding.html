<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!--text forwarding-->
    <font colour="#RRGGBB">HELLO,WORLD</font>
    <font colour="#FF0000">HELLO,WORLD</font>
    <Font colour="00FF00" >HELLO WORLD</Font>
    <u>underlined Text</u>
    <pre>this
        is preformatted
        text</pre>
        <p>paragraph
            text</p>
            <em>emphasized text</em>
            <i>Italic text</i>
            <strong>Strong text</strong>
            <TT>TELETYPE text</TT>
            <strike>strikethrough text</strike>
            <ins>inserted text</ins>
            <p>H<sub>2</sub>o</p>
            <p>X<sup>2</sup></p>
            <mark>Marked text</mark>
            

</body>
</html>
